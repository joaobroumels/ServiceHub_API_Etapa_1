spring.application.name=servicehub-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/servicehub}
spring.datasource.username=${DB_USERNAME:servicehub}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:true}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=2MB
server.error.include-stacktrace=never
server.error.include-message=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
